<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- GRADIENTES (MANTENIDOS) -->
    <linearGradient id="spanish-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#8D6E63" />
    </linearGradient>

    <linearGradient id="burgundy-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#7B1FA2" />
    </linearGradient>

    <linearGradient id="steel-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1" />
      <stop offset="50%" stop-color="#90A4AE" />
      <stop offset="100%" stop-color="#263238" />
    </linearGradient>

    <!-- FILTRO DE SOMBRA (MANTENIDO) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- BASE SHIELD / BANNER DISC -->
  <circle cx="250" cy="250" r="220" fill="#1A0000" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="205" fill="url(#spanish-gold)"/>

  <!-- BROQUEL CENTRAL REMACHADO CON LA CRUZ DE BORGOÑA -->
  <g filter="url(#shadow)">
    <!-- Disco central blanco heráldico -->
    <circle cx="250" cy="265" r="150" fill="#FAFAFA" stroke="url(#spanish-gold)" stroke-width="4"/>
    <circle cx="250" cy="265" r="140" fill="none" stroke="url(#spanish-gold)" stroke-width="2" opacity="0.4"/>

    <!-- CRUZ DE BORGOÑA ROJA ASERRADA (COMPLETAMENTE VISIBLE) -->
    <g transform="translate(250, 265) rotate(45)" fill="#B71C1C">
      <!-- Armas de la cruz aserrada (diseño de diente de sierra mantenido y redimensionado) -->
      <path d="M -22 -100 L 22 -100 L 15 -85 L 30 -70 L 15 -55 L 30 -40 L 15 -25 L 30 -10 L 0 20 L -30 -10 L -15 -25 L -30 -40 L -15 -55 L -30 -70 L -15 -85 Z M -22 100 L 22 100 L 15 85 L 30 70 L 15 55 L 30 40 L 15 25 L 30 10 L 0 -20 L -30 10 L -15 25 L -30 40 L -15 55 L -30 70 L -15 85 Z M -100 -22 L -100 22 L -85 15 L -70 30 L -55 15 L -40 30 L -25 15 L -10 30 L 20 0 L -10 -30 L -25 -15 L -40 -30 L -55 -15 L -70 -30 L -85 -15 Z M 100 -22 L 100 22 L 85 15 L 70 30 L 55 15 L 40 30 L 25 15 L 10 30 L -20 0 L 10 -30 L 25 -15 L 40 -30 L 55 -15 L 70 -30 L 85 -15 Z" />
    </g>

    <!-- REMACHES DORADOS DEL BROQUEL CENTRAL -->
    <g fill="url(#spanish-gold)" stroke="#3E2723" stroke-width="1.5">
      <circle cx="250" cy="135" r="5"/>
      <circle cx="250" cy="395" r="5"/>
      <circle cx="130" cy="265" r="5"/>
      <circle cx="370" cy="265" r="5"/>
      <circle cx="165" cy="180" r="5"/>
      <circle cx="335" cy="180" r="5"/>
      <circle cx="165" cy="350" r="5"/>
      <circle cx="335" cy="350" r="5"/>
    </g>
  </g>

  <!-- CONQUISTADOR HELMET (MORRIÓN) AS HERALDIC CREST (TIMBRE) -->
  <g transform="translate(250, 150)" filter="url(#shadow)">
    <!-- Pluma aserrada de color Borgoña sobre el morrión -->
    <path d="M 0 -85 C 20 -115, 60 -115, 80 -80 L 60 -70 Q 40 -75, 0 -65 Z" fill="#B71C1C" stroke="#1A0000" stroke-width="1.5"/>
    <path d="M 0 -85 L 80 -80 L 60 -65 L 70 -55 L 50 -45 L 60 -35 L 40 -25 L 50 -15 L 0 -30 Z" fill="#B71C1C" opacity="0.8"/>

    <!-- Helmet Comb (Cresta dorada) -->
    <path d="M -60 -40 C -20 -110, 40 -110, 70 -35 C 20 -60, -30 -60, -60 -40 Z" fill="url(#spanish-gold)" stroke="#3E2723" stroke-width="2"/>
    
    <!-- Main Bowl (Acero bruñido) -->
    <path d="M -65 -30 C -60 -80, 60 -80, 65 -30 C 70 10, 45 40, 0 45 C -45 40, -70 10, -65 -30 Z" fill="url(#steel-plate)" stroke="#1C2321" stroke-width="3"/>
    
    <!-- Curved Brim (Ala del Morrión dorada) -->
    <path d="M -90 -15 C -40 10, 40 10, 90 -15 C 60 25, -60 25, -90 -15 Z" fill="url(#spanish-gold)" stroke="#3E2723" stroke-width="2"/>
    
    <!-- Steel Rivets (Remaches de acero) -->
    <circle cx="-40" cy="10" r="3" fill="#37474F"/>
    <circle cx="-20" cy="20" r="3" fill="#37474F"/>
    <circle cx="0" cy="23" r="3" fill="#37474F"/>
    <circle cx="20" cy="20" r="3" fill="#37474F"/>
    <circle cx="40" cy="10" r="3" fill="#37474F"/>
  </g>

  <!-- OUTER REMACHES DEL ÍCONO (MANTENIDOS) -->
  <g fill="url(#spanish-gold)">
    <circle cx="250" cy="60" r="5"/>
    <circle cx="440" cy="250" r="5"/>
    <circle cx="250" cy="440" r="5"/>
    <circle cx="60" cy="250" r="5"/>
    <circle cx="115" cy="115" r="5"/>
    <circle cx="385" cy="115" r="5"/>
    <circle cx="385" cy="385" r="5"/>
    <circle cx="115" cy="385" r="5"/>
  </g>
</svg>
