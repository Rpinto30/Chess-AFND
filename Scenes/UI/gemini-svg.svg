<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gold-maya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#5D4037" />
    </linearGradient>

    <linearGradient id="jade-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="45%" stop-color="#00897B" />
      <stop offset="100%" stop-color="#00352C" />
    </linearGradient>

    <linearGradient id="stone-carved" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90A4AE" />
      <stop offset="50%" stop-color="#37474F" />
      <stop offset="100%" stop-color="#10171A" />
    </linearGradient>

    <linearGradient id="obsidian-blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#546E7A" />
      <stop offset="50%" stop-color="#1C2526" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="wood-carved" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="50%" stop-color="#4E342E" />
      <stop offset="100%" stop-color="#21120B" />
    </linearGradient>

    <linearGradient id="glyph-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- BACKGROUND SOLAR DISC WITH GLYPH BORDER -->
  <circle cx="300" cy="290" r="235" fill="#0A0F12" opacity="0.9" filter="url(#drop-shadow)" />
  <circle cx="300" cy="290" r="222" fill="none" stroke="url(#gold-maya)" stroke-width="3" stroke-dasharray="16 8 4 8" opacity="0.6" />

  <!-- TOP QUETZAL CREST (FEATHERS) -->
  <g filter="url(#drop-shadow)">
    <path d="M 300 110 C 260 30, 180 10, 120 0 C 170 50, 210 100, 260 130 Z" fill="url(#jade-deep)" />
    <path d="M 300 110 C 280 20, 220 0, 170 0 C 210 35, 240 85, 275 125 Z" fill="url(#jade-deep)" opacity="0.85" />
    <path d="M 300 110 C 340 30, 420 10, 480 0 C 430 50, 390 100, 340 130 Z" fill="url(#jade-deep)" />
    <path d="M 300 110 C 320 20, 380 0, 430 0 C 390 35, 360 85, 325 125 Z" fill="url(#jade-deep)" opacity="0.85" />
    <path d="M 300 100 C 300 15, 300 0, 300 0 C 300 15, 300 60, 300 100 Z" fill="url(#jade-deep)" />
    
    <!-- Feather Accents -->
    <path d="M 300 110 C 260 30, 180 10, 120 0" stroke="url(#gold-maya)" stroke-width="1.5" fill="none"/>
    <path d="M 300 110 C 340 30, 420 10, 480 0" stroke="url(#gold-maya)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- DUAL CROSSED MACUAHUITLS -->
  <g filter="url(#drop-shadow)">
    <!-- Macuahuitl 1 -->
    <g transform="rotate(-36 300 290)">
      <rect x="288" y="50" width="24" height="440" rx="3" fill="url(#wood-carved)" stroke="url(#gold-maya)" stroke-width="1.5"/>
      <rect x="285" y="420" width="30" height="50" rx="2" fill="url(#jade-deep)"/>
      <circle cx="300" cy="485" r="14" fill="url(#gold-maya)"/>
      <path d="M 288 80 L 270 92 L 288 108 L 270 120 L 288 136 L 270 148 L 288 164 L 270 176 L 288 192 L 270 204 L 288 220 L 270 232 L 288 248 L 270 260 L 288 276 L 270 288 L 288 304 Z" fill="url(#obsidian-blade)"/>
      <path d="M 312 80 L 330 92 L 312 108 L 330 120 L 312 136 L 330 148 L 312 164 L 330 176 L 312 192 L 330 204 L 312 220 L 330 232 L 312 248 L 330 260 L 312 276 L 330 288 L 312 304 Z" fill="url(#obsidian-blade)"/>
    </g>

    <!-- Macuahuitl 2 -->
    <g transform="rotate(36 300 290)">
      <rect x="288" y="50" width="24" height="440" rx="3" fill="url(#wood-carved)" stroke="url(#gold-maya)" stroke-width="1.5"/>
      <rect x="285" y="420" width="30" height="50" rx="2" fill="url(#jade-deep)"/>
      <circle cx="300" cy="485" r="14" fill="url(#gold-maya)"/>
      <path d="M 288 80 L 270 92 L 288 108 L 270 120 L 288 136 L 270 148 L 288 164 L 270 176 L 288 192 L 270 204 L 288 220 L 270 232 L 288 248 L 270 260 L 288 276 L 270 288 L 288 304 Z" fill="url(#obsidian-blade)"/>
      <path d="M 312 80 L 330 92 L 312 108 L 330 120 L 312 136 L 330 148 L 312 164 L 330 176 L 312 192 L 330 204 L 312 220 L 330 232 L 312 248 L 330 260 L 312 276 L 330 288 L 312 304 Z" fill="url(#obsidian-blade)"/>
    </g>
  </g>

  <!-- CENTRAL MAYAN HIEROGLYPH BLOCK (CARTOUCHE / EMBLEM GLYPH) -->
  <g filter="url(#drop-shadow)">
    
    <!-- Outer Glyphic Affixes (Left & Right Volutes) -->
    <!-- Left Affix (K'atun / Water scroll affix) -->
    <path d="M 185 240 C 160 220, 150 260, 165 280 C 180 300, 160 330, 185 340 C 195 310, 180 290, 190 270 Z" fill="url(#stone-carved)" stroke="url(#gold-maya)" stroke-width="2.5"/>
    <circle cx="170" cy="260" r="5" fill="url(#jade-deep)"/>
    <circle cx="175" cy="310" r="5" fill="url(#jade-deep)"/>

    <!-- Right Affix -->
    <path d="M 415 240 C 440 220, 450 260, 435 280 C 420 300, 440 330, 415 340 C 405 310, 420 290, 410 270 Z" fill="url(#stone-carved)" stroke="url(#gold-maya)" stroke-width="2.5"/>
    <circle cx="430" cy="260" r="5" fill="url(#jade-deep)"/>
    <circle cx="425" cy="310" r="5" fill="url(#jade-deep)"/>

    <!-- Top Superfix (Ajaw / Royal Crown Glyph element) -->
    <path d="M 230 165 Q 300 145, 370 165 Q 380 195, 360 200 Q 300 185, 240 200 Q 220 195, 230 165 Z" fill="url(#jade-deep)" stroke="url(#gold-maya)" stroke-width="3"/>
    <!-- Three Top Jade Beads (Royalty dots) -->
    <circle cx="260" cy="160" r="8" fill="url(#gold-maya)"/>
    <circle cx="300" cy="152" r="10" fill="url(#gold-maya)"/>
    <circle cx="340" cy="160" r="8" fill="url(#gold-maya)"/>

    <!-- MAIN GLYPH BLOCK CARTOUCHE FRAME -->
    <rect x="200" y="190" width="200" height="200" rx="45" fill="url(#stone-carved)" stroke="url(#gold-maya)" stroke-width="7" />
    <rect x="208" y="198" width="184" height="184" rx="38" fill="none" stroke="url(#jade-deep)" stroke-width="3" />

    <!-- INNER MAYAN HIEROGLYPH: "KAB'AWIL / CHESS AJAW" -->
    <g transform="translate(200, 190)">
      
      <!-- Glyph Background Dark Inset -->
      <rect x="15" y="15" width="170" height="170" rx="30" fill="#0A0D0F"/>

      <!-- GLYPH FACE & SYMBOLS (Carved Glyphic Lines) -->
      
      <!-- Forehead Mirror / Smoking Torch (K'awil Attribute) -->
      <path d="M 85 30 C 70 30, 65 45, 85 50 C 105 45, 100 30, 85 30 Z" fill="url(#glyph-fire)"/>
      <circle cx="85" cy="40" r="4" fill="#FFFFFF"/>
      <!-- Smoke Volutes from Forehead -->
      <path d="M 85 30 C 80 15, 60 20, 70 10" stroke="url(#gold-maya)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 85 30 C 90 15, 110 20, 100 10" stroke="url(#gold-maya)" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Classic Mayan Eye (Spiral Pupil / Square Frame) -->
      <rect x="45" y="60" width="38" height="30" rx="8" fill="url(#stone-carved)" stroke="url(#gold-maya)" stroke-width="2.5"/>
      <path d="M 55 68 C 65 65, 75 75, 65 82 C 58 85, 55 75, 62 73" fill="none" stroke="url(#gold-maya)" stroke-width="3" stroke-linecap="round"/>

      <!-- Dual Profile / Second Eye (Representing Kab'awil Double Sight) -->
      <rect x="117" y="60" width="38" height="30" rx="8" fill="url(#stone-carved)" stroke="url(#gold-maya)" stroke-width="2.5"/>
      <path d="M 127 68 C 137 65, 147 75, 137 82 C 130 85, 127 75, 134 73" fill="none" stroke="url(#gold-maya)" stroke-width="3" stroke-linecap="round"/>

      <!-- Mayan Nose Bridge & Serpent Snout (Central Pillar) -->
      <path d="M 85 55 L 115 55 L 105 105 L 85 105 Z" fill="url(#gold-maya)"/>
      <circle cx="100" cy="98" r="5" fill="url(#jade-deep)"/>

      <!-- Cheek Motif: Integrated Chess Grid (Abstract Glyph Bar & Dots) -->
      <!-- Left Cheek: Maya Bar (5) and Dots (2) = Mayan Number / Grid -->
      <rect x="35" y="105" width="30" height="6" rx="2" fill="url(#gold-maya)"/>
      <circle cx="42" cy="118" r="3" fill="url(#gold-maya)"/>
      <circle cx="58" cy="118" r="3" fill="url(#gold-maya)"/>

      <!-- Right Cheek: Chess Board Grid Glyph -->
      <g transform="translate(125, 102)">
        <rect x="0" y="0" width="20" height="20" fill="none" stroke="url(#gold-maya)" stroke-width="1.5"/>
        <rect x="0" y="0" width="10" height="10" fill="url(#gold-maya)"/>
        <rect x="10" y="10" width="10" height="10" fill="url(#gold-maya)"/>
      </g>

      <!-- Glyph Mouth & Jaw (Spiraled Snake Jaw / Fangs) -->
      <path d="M 50 135 C 50 120, 70 125, 100 125 C 130 125, 150 120, 150 135 C 150 160, 125 168, 100 168 C 75 168, 50 160, 50 135 Z" fill="url(#stone-carved)" stroke="url(#gold-maya)" stroke-width="3"/>
      
      <!-- Fangs / Breath Scroll (Iq' Glyph Element) -->
      <path d="M 75 135 L 82 150 L 89 135" fill="url(#gold-maya)"/>
      <path d="M 111 135 L 118 150 L 125 135" fill="url(#gold-maya)"/>
      <path d="M 100 140 C 90 155, 110 155, 100 162" fill="none" stroke="url(#jade-deep)" stroke-width="2.5"/>

    </g>

    <!-- Bottom Subfix (Pedestal / Base Glyph) -->
    <path d="M 220 390 Q 300 410, 380 390 L 360 415 Q 300 425, 240 415 Z" fill="url(#stone-carved)" stroke="url(#gold-maya)" stroke-width="2.5"/>
    <circle cx="300" cy="407" r="6" fill="url(#jade-deep)"/>
  </g>

  <!-- BANNER & TYPOGRAPHY -->
  <g filter="url(#drop-shadow)">
    <!-- Carved Stone Tablet Banner -->
    <path d="M 110 515 Q 300 490, 490 515 L 500 575 Q 300 545, 100 575 Z" fill="url(#stone-carved)" stroke="url(#gold-maya)" stroke-width="4"/>
    
    <!-- Jade Side Clamps -->
    <rect x="90" y="520" width="24" height="45" rx="4" fill="url(#jade-deep)" stroke="url(#gold-maya)" stroke-width="2"/>
    <rect x="486" y="520" width="24" height="45" rx="4" fill="url(#jade-deep)" stroke="url(#gold-maya)" stroke-width="2"/>

    <!-- TITLE: KAB'AWIL -->
    <text x="300" y="552" font-family="'Trajan Pro', 'Cinzel', 'Georgia', serif" font-size="32" font-weight="900" fill="url(#gold-maya)" text-anchor="middle" letter-spacing="6">
      KAB'AWIL
    </text>

    <!-- SUBTITLE TABLET: LA INVASIÓN -->
    <rect x="190" y="582" width="220" height="32" rx="4" fill="#060A0C" stroke="url(#gold-maya)" stroke-width="2" />
    <text x="300" y="604" font-family="'Trajan Pro', 'Cinzel', 'Georgia', serif" font-size="15" font-weight="bold" fill="#00E676" text-anchor="middle" letter-spacing="6">
      LA INVASIÓN
    </text>
  </g>
</svg>
